name: Build installers

# Manual, plus every version tag. Deliberately not on every push to main: a run
# is about ten minutes on a runner and produces a ~140 MB artifact, and nobody
# looks at an installer that was not cut for a reason. check-types and test still
# run here before packaging, because a build that ships a broken app is worse
# than no build, but they are not the reason this workflow exists.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# A second tag push while the first is still building would race for the same
# artifact name. Newest wins.
concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows only, and Windows is the whole reason this workflow exists.
  # better-sqlite3 is a native module and has to be loaded by Electron's own V8,
  # so it needs a binary built against Electron's ABI for win32-x64. That binary
  # cannot be produced on a Mac: electron-builder runs @electron/rebuild before
  # packaging, and asking it for x64 from an arm64 Mac stops at "node-gyp does
  # not support cross-compiling native modules from source". Worse is what
  # happens when the arch happens to match. A `--win --dir` build on an arm64 Mac
  # completes and looks fine, and the better_sqlite3.node inside the Windows app
  # is a Mach-O bundle. The app installs, launches, and dies the moment it opens
  # the database. So: build Windows on Windows.
  #
  # The dmg used to ride along here on a macos-latest runner. It went because we
  # develop on an arm64 Mac and `pnpm --filter @qale/desktop run dmg` produces
  # the same artifact locally in less time than pushing and waiting. Nothing
  # about the Mac build needs CI. If that changes, the day a release has to be
  # cut from a machine that is not Erik's, or the day an Intel or universal build
  # arrives, put a matrix back: the job below is already shaped for it and git
  # history has the exact block that was deleted.
  #
  # Note what this costs. `pnpm test` and `pnpm check-types` now run on Windows
  # and nowhere else in CI, so a change that only breaks macOS gets caught by
  # whoever runs the tests locally, not here.
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      # Windows still enforces the 260-character path limit unless git is told
      # otherwise, and pnpm's store plus Electron's node_modules go well past it.
      # This has to run before checkout or the checkout itself is what fails.
      - name: Allow long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      # Order matters: pnpm has to be on PATH before setup-node, because
      # `cache: pnpm` below works by running `pnpm store path`. Swap these two
      # steps and setup-node fails with "Unable to locate executable file: pnpm".
      # No version pinned here on purpose: the action reads `packageManager`
      # from the root package.json, so the version lives in one place.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # engines.node in the root package.json says >= 22.19; 24 is what the
          # app is developed against. Keep these two moving together.
          node-version: 24
          cache: pnpm

      # Not --ignore-scripts. pnpm blocks postinstall scripts by default, and
      # the ones we need are approved by name in pnpm-workspace.yaml
      # (onlyBuiltDependencies: electron, better-sqlite3, esbuild). Without them
      # Electron never downloads its binary and there is nothing to package.
      # That list is honoured non-interactively, so no `pnpm approve-builds`
      # step is needed here; if a new native dependency ever appears, it gets
      # added there rather than worked around in this file.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

      - name: Test
        run: pnpm test

      # This runs electron-vite build and then electron-builder. electron-builder
      # rebuilds better-sqlite3 against Electron's ABI on the way (npmRebuild is
      # on by default), which on this runner is a native, same-platform rebuild.
      # It will normally pull a prebuilt binary; if better-sqlite3 has no prebuild
      # for this Electron ABI it compiles from source instead, which is slower but
      # works, because the GitHub runners ship the MSVC toolchain.
      #
      # Unsigned, and nothing here has to say so. electron-builder runs its
      # signing step, finds no credential, logs that it skipped, and carries on.
      # What a tester sees because of that, and the two ways to fix it, are in
      # the `win:` block of electron-builder.yml.
      # electron.vite.config.ts reads these from process.env at build time and
      # bakes them into the bundle (see src/main/build-env.ts): a packaged app
      # launched from the Start Menu never sees a runtime env var, so anything
      # not set here ships as an empty string and the feature it configures
      # dies quietly. Values come from repo secrets; set them under Settings →
      # Secrets and variables → Actions. A secret that was never added resolves
      # to '', same as an unset shell variable, so a missing one is silent here
      # too — check the built app if a baked feature stops working.
      - name: Package
        env:
          QALE_GOOGLE_CLIENT_ID: ${{ secrets.QALE_GOOGLE_CLIENT_ID }}
          QALE_GOOGLE_CLIENT_SECRET: ${{ secrets.QALE_GOOGLE_CLIENT_SECRET }}
          QALE_POSTHOG_KEY: ${{ secrets.QALE_POSTHOG_KEY }}
          QALE_POSTHOG_HOST: ${{ secrets.QALE_POSTHOG_HOST }}
        run: pnpm --filter @qale/desktop run win

      - uses: actions/upload-artifact@v4
        with:
          name: qale-windows-installer
          path: apps/desktop/dist/*.exe
          # A glob that matches nothing means the packaging step changed its
          # output name and nobody noticed. Fail instead of uploading an empty
          # artifact that only looks like a successful build.
          if-no-files-found: error
          # This is ~140 MB and rebuildable from the tag. Ninety days of them is
          # storage nobody asked for.
          retention-days: 14
